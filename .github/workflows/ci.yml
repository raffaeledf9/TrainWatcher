name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Secret scan (files and history)
        run: python3 scripts/secret_scan.py && python3 scripts/secret_scan.py --history HEAD
      - name: Unit tests
        run: python3 -m unittest -q
