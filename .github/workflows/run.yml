name: run
# One TrainWatcher run: drain the Worker's queue, check due prices, save encrypted state.
# Started by the Cloudflare Worker (workflow_dispatch); the hourly schedule is only a fallback (ADR 0001).
on:
  workflow_dispatch:
    inputs:
      reason: { description: "why the run was started", required: false, default: "manual" }
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: trainwatcher-run
  cancel-in-progress: false

permissions:
  contents: write   # push the encrypted state branch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      STATE_DB: state.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Restore state
        id: restore
        # "no state branch yet" (first run ever) must never be confused with "GitHub didn't answer": the latter
        # fails the step, so Save state is skipped and the real state is never overwritten with an empty one
        run: |
          rc=1
          for i in 1 2 3; do
            rc=0; git ls-remote --exit-code origin state >/dev/null 2>&1 || rc=$?
            [ "$rc" = 0 ] || [ "$rc" = 2 ] && break
            sleep $((i * 10))
          done
          if [ "$rc" = 2 ]; then echo "no state yet"; exit 0; fi
          [ "$rc" = 0 ] || { echo "state branch unreachable"; exit 1; }
          for i in 1 2 3; do
            git fetch -q --depth=1 origin state && break
            [ "$i" = 3 ] && { echo "state fetch failed"; exit 1; }
            sleep $((i * 10))
          done
          if git show FETCH_HEAD:state.db.gz.enc > state.enc 2>/dev/null; then   # gzip-compressed (current format)
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in state.enc -out state.db.gz
            gunzip -c state.db.gz > state.db
          else                                                                  # the older uncompressed format
            git show FETCH_HEAD:state.db.enc > state.enc
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in state.enc -out state.db
          fi
          echo "state restored"
      - name: Run
        run: python -m trainwatcher.run
      - name: Save state
        # never overwrite good state after a failed restore; do save after a failed run (partial work is real)
        if: always() && steps.restore.outcome == 'success' && hashFiles('state.db') != ''
        run: |
          gzip -9 -c state.db > /tmp/state.db.gz   # SQLite full of JSON compresses several times over
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:STATE_KEY -in /tmp/state.db.gz -out /tmp/state.db.gz.enc
          echo "state size: $(stat -c %s state.db) bytes, saved $(stat -c %s /tmp/state.db.gz.enc)"
          cd "$(mktemp -d)" && cp /tmp/state.db.gz.enc . && git init -q -b state && git add state.db.gz.enc
          git -c user.name=trainwatcher -c user.email=trainwatcher@users.noreply.github.com commit -qm "state"
          for i in 1 2 3; do   # GitHub occasionally answers 500; retry before failing the run
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state && echo "state saved" && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Report done
        # only now does the run count as done for the Worker's dead-man switch (it messages the Owner after 30 min
        # without one); a dead Worker is reported by the job itself, so don't fail the run over it
        run: |
          curl -fsS -m 30 -X POST -H "Authorization: Bearer $WORKER_SECRET" "$WORKER_URL/job/done" -o /dev/null || echo "worker unreachable"
