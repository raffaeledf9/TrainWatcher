name = "trainwatcher"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Every minute: 5-minute price-check tick, queue safety net (watchdog added in R8).
[triggers]
crons = ["* * * * *"]

[vars]
GH_REPO = "raffaeledf9/TrainWatcher"
GH_WORKFLOW = "run.yml"

# The Mini App form (webapp/index.html + stations.json), same origin as /form.
[assets]
directory = "../webapp"

[[d1_databases]]
binding = "DB"
database_name = "trainwatcher"
database_id = "88754439-00b4-4acc-9f40-d72dcb6dfd89"

# Secrets (wrangler secret put): TELEGRAM_TOKEN, TG_SECRET, GH_TOKEN, WORKER_SECRET, OWNER_CHAT_ID
